apiVersion: batch/v1
kind: Job
metadata:
  generateName: presync-job-
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  template:
    spec:
      containers:
        - name: pre-sync-job
          image: ubuntu
          command: [ "bash", "-c", "echo PRESYNC && sleep 220 && echo DONE" ]
      restartPolicy: Never
